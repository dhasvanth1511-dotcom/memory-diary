<!DOCTYPE html>
<html>

<head>

    <title>Locked Memories</title>

    <link rel="stylesheet" href="style.css">

</head>

<body onload="loadLockedMemories()">

    <!-- TOP NAVBAR -->

    <div class="navbar">

        <div class="nav-left">

            <button
                class="backBtn"
                onclick="location.href='home.html'">

                ← Back

            </button>

            <div class="logo">
                🔒 Locked Memories
            </div>

        </div>

    </div>

    <div class="overlay">

        <div class="container">

            <h1>
                🔒 Private Memories
            </h1>

            <p class="subtitle">
                Your secure and personal memories protected safely
            </p>

            <!-- SEARCH -->

            <input
                type="text"
                id="lockedSearch"
                class="searchBox"
                placeholder="🔍 Search locked memories..."
                onkeyup="searchLockedMemories()"
            >

            <!-- DATE FILTER -->

            <input
                type="date"
                id="lockedDateSearch"
                class="searchBox"
                onchange="searchLockedDate()"
            >

            <!-- LOCKED MEMORY LIST -->

            <div id="lockedContainer">

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
