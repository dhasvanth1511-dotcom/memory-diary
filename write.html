<!DOCTYPE html>
<html>

<head>

    <title>Write Memory</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="overlay">

        <div class="container">

            <h1>✍ Write Memory</h1>

            <input
                type="text"
                id="memoryTitle"
                placeholder="Memory Title"
            >

            <textarea
                id="memoryText"
                placeholder="Write your memory..."
            ></textarea>

            <select id="memoryMood">

                <option>Happy</option>

                <option>Sad</option>

                <option>Angry</option>

                <option>Calm</option>

                <option>Excited</option>

            </select>

            <label>

                <input
                    type="checkbox"
                    id="favoriteCheck"
                >

                ⭐ Favorite Memory

            </label>

            <label>

                <input
                    type="checkbox"
                    id="lockCheck"
                >

                🔒 Lock Memory

            </label>

            <button onclick="saveMemory()">
                Save Memory
            </button>

            <button onclick="location.href='home.html'">
                Home
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
