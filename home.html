<!DOCTYPE html>
<html>

<head>

    <title>Memory Diary Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body onload="loadHome()">

    <!-- TOP NAVBAR -->

    <div class="navbar">

        <div class="nav-left">

            <button
                class="backBtn"
                onclick="logout()">

                ← Logout

            </button>

            <div class="logo">
                📖 Memory Diary
            </div>

        </div>

    </div>

    <div class="overlay">

        <div class="container home-container">

            <h1 id="welcomeText">
                ✨ Welcome
            </h1>

            <p class="subtitle">
                Capture your emotions, moments and life memories forever
            </p>

            <!-- STATS -->

            <div class="statsGrid">

                <div class="statCard">

                    <h2 id="totalMemories">
                        0
                    </h2>

                    <p>
                        Total Memories
                    </p>

                </div>

                <div class="statCard">

                    <h2 id="favoriteCount">
                        0
                    </h2>

                    <p>
                        Favorite Memories
                    </p>

                </div>

                <div class="statCard">

                    <h2 id="lockedCount">
                        0
                    </h2>

                    <p>
                        Locked Memories
                    </p>

                </div>

            </div>

            <!-- MAIN BUTTONS -->

            <div class="homeButtons">

                <button
                    class="mainButton"
                    onclick="location.href='write.html'">

                    ✍️ Write Memory
                </button>

                <button
                    class="mainButton"
                    onclick="location.href='memories.html'">

                    📚 View Memories
                </button>

                <button
                    class="mainButton"
                    onclick="location.href='favorites.html'">

                    ⭐ Favorite Memories
                </button>

                <button
                    class="mainButton"
                    onclick="location.href='locked.html'">

                    🔒 Locked Memories
                </button>

            </div>

            <!-- QUOTE -->

            <div class="quoteBox">

                “Every memory deserves to live forever.”

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
