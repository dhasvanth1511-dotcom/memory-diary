<!DOCTYPE html>
<html>

<head>

    <title>Memories</title>

    <link rel="stylesheet" href="style.css">

</head>

<body onload="loadMemories()">

    <!-- TOP NAVBAR -->

    <div class="navbar">

        <div class="nav-left">

            <button
                class="backBtn"
                onclick="location.href='home.html'">

                ← Back

            </button>

            <div class="logo">
                📖 Memory Diary
            </div>

        </div>

    </div>

    <div class="overlay">

        <div class="container">

            <h1>
                📚 All Memories
            </h1>

            <p class="subtitle">
                Search memories by date or keyword
            </p>

            <!-- SEARCH -->

            <input
                type="text"
                id="searchInput"
                class="searchBox"
                placeholder="🔍 Search memories..."
                onkeyup="searchMemories()"
            >

            <!-- DATE SEARCH -->

            <input
                type="date"
                id="dateSearch"
                class="searchBox"
                onchange="searchByDate()"
            >

            <!-- MEMORY LIST -->

            <div id="memoryList">

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
