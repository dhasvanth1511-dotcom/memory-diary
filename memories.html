<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>View Memories</title>

    <link rel="stylesheet" href="style.css">

</head>

<body onload="loadMemories()">

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="nav-left">

            <button
                class="backBtn"
                onclick="window.location.href='home.html'">

                ← Back

            </button>

            <div class="logo">

                📖 Memory Diary

            </div>

        </div>

    </div>


    <!-- MAIN -->

    <div class="overlay">

        <div class="container">

            <h1>
                📚 Your Memories
            </h1>

            <p class="subtitle">

                Search your memories using
                dates, moods or keywords.

            </p>


            <!-- SEARCH SECTION -->

            <div class="searchSection">

                <!-- KEYWORD SEARCH -->

                <input
                    type="text"
                    id="searchInput"
                    class="searchBox"
                    placeholder="🔍 Search memories by keyword..."
                    onkeyup="searchMemories()"
                >


                <!-- DATE SEARCH -->

                <div class="dateSearchWrapper">

                    <input
                        type="date"
                        id="dateSearch"
                        class="searchBox dateInput"
                        onchange="searchByDate()"
                    >

                </div>


                <!-- CLEAR SEARCH -->

                <button
                    class="clearBtn"
                    onclick="clearSearch()"
                >

                    🔄 Clear Search

                </button>

            </div>


            <!-- NO RESULTS -->

            <div id="noResults"></div>


            <!-- MEMORY CONTAINER -->

            <div id="memoryContainer"></div>

        </div>

    </div>

<script src="script.js"></script>

</body>

</html>
