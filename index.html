<!DOCTYPE html>
<html>

<head>

    <title>Memory Diary Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="overlay">

        <div class="container">

            <h1>📖 Memory Diary</h1>

            <input
                type="text"
                id="loginUsername"
                placeholder="Username"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button onclick="login()">
                Login
            </button>

            <br><br>

            <a href="signup.html">
                Create New User
            </a>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
