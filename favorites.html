<!DOCTYPE html>
<html>

<head>

    <title>Favorite Memories</title>

    <link rel="stylesheet" href="style.css">

</head>

<body onload="loadFavorites()">

    <!-- TOP NAVBAR -->

    <div class="navbar">

        <div class="nav-left">

            <button
                class="backBtn"
                onclick="location.href='home.html'">

                ← Back

            </button>

            <div class="logo">
                ⭐ Favorite Memories
            </div>

        </div>

    </div>

    <div class="overlay">

        <div class="container">

            <h1>
                ⭐ Golden Memories
            </h1>

            <p class="subtitle">
                Your most precious moments collected in one place
            </p>

            <!-- SEARCH -->

            <input
                type="text"
                id="favoriteSearch"
                class="searchBox"
                placeholder="🔍 Search favorite memories..."
                onkeyup="searchFavorites()"
            >

            <!-- DATE FILTER -->

            <input
                type="date"
                id="favoriteDateSearch"
                class="searchBox"
                onchange="searchFavoriteDate()"
            >

            <!-- FAVORITES LIST -->

            <div id="favoritesContainer">

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
