<!DOCTYPE html>

<html>

<head>

    <title>Create Account</title>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="loginContainer">

        <h1>Create Account</h1>





        <input

            type="text"

            id="signupUsername"

            placeholder="Enter Username"

        >





        <input

            type="password"

            id="signupPassword"

            placeholder="Enter Password"

        >





        <input

            type="password"

            id="signupPin"

            placeholder="Create 4 Digit PIN"

        >





        <button onclick="createUser()">

            Create User

        </button>





        <br><br>





        <a href="index.html">

            Back To Login

        </a>

    </div>





    <script src="script.js"></script>

</body>

</html>
