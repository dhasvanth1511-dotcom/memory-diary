<!DOCTYPE html>
<html>

<head>
    <title>Create User</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="overlay">

        <div class="login-box">

            <h1>
                ✨ Create Account
            </h1>

            <p class="subtitle">

                Start your memory journey today.

            </p>


            <!-- USERNAME -->

            <input
                type="text"
                id="signupUsername"
                placeholder="Create Username"
            >


            <!-- PASSWORD -->

            <input
                type="password"
                id="signupPassword"
                placeholder="Create Password"
            >


            <!-- CONFIRM PASSWORD -->

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
            >


            <!-- BUTTON -->

            <button onclick="signup()">

                Create Account

            </button>


            <br><br>

            <button
                class="backBtn"
                onclick="window.location.href='index.html'"
            >

                ← Back to Login

            </button>

        </div>

    </div>

<script src="script.js"></script>

</body>
</html>
