<!DOCTYPE html>
<html>

<head>

    <title>Create User</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="overlay">

        <div class="container">

            <h1>Create User</h1>

            <input
                type="text"
                id="signupUsername"
                placeholder="New Username"
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="New Password"
            >

            <button onclick="createUser()">
                Create User
            </button>

            <br><br>

            <a href="index.html">
                Back To Login
            </a>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
